<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gran Ciudad Auto</title>
<style>
:root{--bg:#e9edf3;--card:#ffffff;--fg:#14171d;--mut:#586071;--ac:#c9510c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1016;--card:#171b24;--fg:#f3f5f8;--mut:#9aa3b5;--ac:#ffb02e}}
:root[data-theme="dark"]{--bg:#0e1016;--card:#171b24;--fg:#f3f5f8;--mut:#9aa3b5;--ac:#ffb02e}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{position:relative}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,16,.55);backdrop-filter:blur(4px)}
.card{max-width:440px;margin:16px;padding:26px 28px;border-radius:16px;background:var(--card);color:var(--fg);box-shadow:0 24px 70px rgba(0,0,0,.45)}
h1{margin:0 0 6px;font-size:32px;line-height:1.05;letter-spacing:1px;color:var(--ac);font-family:Impact,"Arial Narrow Bold",sans-serif;font-weight:400}
.card p{margin:0 0 14px;color:var(--mut);line-height:1.45}
.card ul{margin:0 0 18px;padding-left:18px;line-height:1.7;font-size:15px}
.card b{color:var(--ac)}
button{font:inherit;font-weight:700;font-size:17px;padding:11px 26px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov"><div class="card">
<h1>GRAN CIUDAD AUTO</h1>
<p>Una ciudad abierta de 12×12 manzanas. Roba un coche, haz misiones de taxi y escapa de la policía.</p>
<ul>
<li><b>WASD</b> o flechas: moverte / conducir</li>
<li><b>E</b>: subir o bajar de un coche</li>
<li><b>Espacio</b> o clic: disparar a pie; en coche, freno de mano</li>
<li><b>Shift</b>: correr · el ratón apunta</li>
</ul>
<button id="go">Jugar</button>
</div></div>
<script>
const M=Math,PI=M.PI,rnd=M.random,cos=M.cos,sin=M.sin,cl=(v,a,b)=>v<a?a:v>b?b:v;
const wrap=a=>{while(a>PI)a-=2*PI;while(a<-PI)a+=2*PI;return a};
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR,zb=1;
function rs(){DPR=M.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;zb=M.min(W,H)/760}
addEventListener('resize',rs);rs();
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- mundo ---------- */
const B=420,R=120,N=12,WS=B*N,PH=[210,200,35,12,160,280,25,0],blocks=[];
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
 const r=rng(i*977+j*131+7),x0=i*B+R,y0=j*B+R,s=B-R,bl={x:x0,y:y0,s,park:r()<.13,b:[],t:[]};
 if(bl.park)for(let k=0;k<12;k++)bl.t.push([x0+24+r()*(s-48),y0+24+r()*(s-48),9+r()*9]);
 else{const nx=r()<.5?1:2,ny=r()<.5?1:2,p=18,cw=(s-p*2)/nx,chh=(s-p*2)/ny;
  for(let a=0;a<nx;a++)for(let b=0;b<ny;b++){const m=4+r()*8,h=PH[r()*PH.length|0],l=44+r()*16,sa=14+r()*26;
   bl.b.push({x:x0+p+a*cw+m,y:y0+p+b*chh+m,w:cw-m*2,h:chh-m*2,hg:.12+r()*.5,cr:`hsl(${h} ${sa}% ${l}%)`,cd:`hsl(${h} ${sa}% ${l+8}%)`,ch:`hsl(${h} ${sa}% ${l-16}%)`,cv:`hsl(${h} ${sa}% ${l-27}%)`})}}
 blocks.push(bl)}
const isRoad=(x,y)=>x>=0&&y>=0&&x<WS&&y<WS&&(x%B<R||y%B<R);
function hit(x,y,r){
 if(x<r)return{nx:1,ny:0,p:r-x};if(y<r)return{nx:0,ny:1,p:r-y};
 if(x>WS-r)return{nx:-1,ny:0,p:x-WS+r};if(y>WS-r)return{nx:0,ny:-1,p:y-WS+r};
 const bl=blocks[(y/B|0)*N+(x/B|0)];
 for(const b of bl.b){const cx=cl(x,b.x,b.x+b.w),cy=cl(y,b.y,b.y+b.h),dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
  if(d2<r*r){const d=M.sqrt(d2)||.01;return{nx:dx/d,ny:dy/d,p:r-d}}}
 return null}
/* ---------- estado ---------- */
const K={},mouse={x:0,y:0,wx:0,wy:0,down:0,act:0};let pressE=0;
addEventListener('keydown',e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();if(k==='e'&&!K.e)pressE=1;K[k]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>{K[e.key.length>1?e.key:e.key.toLowerCase()]=0});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.act=1});
cv.addEventListener('mousedown',()=>mouse.down=1);addEventListener('mouseup',()=>mouse.down=0);
const PALC=['#d94841','#2f6fdb','#e8e8ea','#1c1f24','#f2b630','#3aa66b','#8e5bd6','#e87b2e'];
let cars=[],peds=[],bul=[],par=[],dec=[],toasts=[],big=null,P,cam={x:0,y:0,z:1,sh:0},money=500,heat=0,stars=0,gt=0,run=false,ms=null,msCd=4,busted=0,hour=8;
const crime=n=>{heat=M.min(5.99,heat+n)};
const toast=(s,c)=>{toasts.push({s,c:c||'#fff',t:3.2});if(toasts.length>4)toasts.shift()};
function mk(x,y,a,k){const c={x,y,a,d:M.round(a/(PI/2))&3,v:0,k,hp:k=='c'?120:70,col:k=='c'?'#1b3a8a':PALC[rnd()*PALC.length|0],hit:0,li:-1,bt:0,ts:170};cars.push(c);return c}
function lane(c,d,x,y){c.d=d;c.a=d*PI/2;
 if(d%2==0){c.y=cl(M.round((y-R/2)/B),0,N-1)*B+R/2+(d==0?22:-22);c.x=x}
 else{c.x=cl(M.round((x-R/2)/B),0,N-1)*B+R/2+(d==1?-22:22);c.y=y}
 c.v=150}
function reset(first){
 if(!first){cars=cars.filter(q=>q.k!='c'&&q!==(P&&P.car))}
 P={x:6*B+R/2+34,y:6*B+R/2+34,a:0,hp:100,car:null,sh:0,inv:0};
 const c=mk(0,0,0,'o');lane(c,0,P.x+90,P.y);c.v=0;c.col='#f2b630'}
function respawn(t,c,loss){big={s:t,c,t:2.8};money=M.max(0,money-loss);heat=0;busted=0;reset(0);if(ms){ms=null;msCd=5}}
/* ---------- coches ---------- */
function move(c,dt){c.x+=cos(c.a)*c.v*dt;c.y+=sin(c.a)*c.v*dt;
 const h=hit(c.x,c.y,19);if(h){c.x+=h.nx*h.p;c.y+=h.ny*h.p;const imp=M.abs(c.v);if(imp>140){c.hp-=(imp-110)*.07;spark(c.x,c.y);if(c===P.car)cam.sh=M.max(cam.sh,6)}c.v*=-.3;c.hit=2;return 1}return 0}
function driveP(dt){const c=P.car,up=K.w||K.ArrowUp,dn=K.s||K.ArrowDown,lf=K.a||K.ArrowLeft,rt=K.d||K.ArrowRight,acc=(up?1:0)-(dn?1:0);
 if(acc>0)c.v+=(c.v<0?700:380)*dt;else if(acc<0)c.v-=(c.v>0?700:260)*dt;
 c.v-=c.v*.55*dt;if(K[' '])c.v-=c.v*2.6*dt;c.v=cl(c.v,-170,560);
 const sf=cl(c.v/170,-1,1)/(1+M.abs(c.v)/650);
 c.a+=((rt?1:0)-(lf?1:0))*2.9*dt*sf*(K[' ']?1.5:1);
 if(!isRoad(c.x,c.y))c.v-=c.v*1.3*dt;
 move(c,dt);
 if(K[' ']&&M.abs(c.v)>220&&rnd()<.6)smoke(c.x-cos(c.a)*18,c.y-sin(c.a)*18,'#cfd2d8',.6);
 P.x=c.x;P.y=c.y;P.a=c.a}
function foot(dt){const mx=(K.d||K.ArrowRight?1:0)-(K.a||K.ArrowLeft?1:0),my=(K.s||K.ArrowDown?1:0)-(K.w||K.ArrowUp?1:0),l=M.hypot(mx,my)||1,sp=K.Shift?250:150;
 P.x+=mx/l*sp*dt;P.y+=my/l*sp*dt;const h=hit(P.x,P.y,9);if(h){P.x+=h.nx*h.p;P.y+=h.ny*h.p}
 if(mouse.act)P.a=M.atan2(mouse.wy-P.y,mouse.wx-P.x);else if(mx||my)P.a=M.atan2(my,mx);
 P.sh-=dt;P.inv-=dt;
 if((mouse.down||K[' '])&&P.sh<=0){P.sh=.16;bul.push({x:P.x+cos(P.a)*14,y:P.y+sin(P.a)*14,vx:cos(P.a)*1200,vy:sin(P.a)*1200,t:.5});spark(P.x+cos(P.a)*16,P.y+sin(P.a)*16)}
 if(stars==0)P.hp=M.min(100,P.hp+2*dt)}
function toggleCar(){
 if(P.car){const c=P.car;if(M.abs(c.v)>260)return;P.car=null;c.k='o';P.x=c.x+cos(c.a+PI/2)*34;P.y=c.y+sin(c.a+PI/2)*34;const h=hit(P.x,P.y,9);if(h){P.x+=h.nx*h.p;P.y+=h.ny*h.p}return}
 let best=null,bd=70;for(const c of cars){const d=M.hypot(c.x-P.x,c.y-P.y);if(d<bd&&M.abs(c.v)<230){bd=d;best=c}}
 if(!best)return;
 if(best.k=='c')crime(1.5);else if(best.k=='t'){crime(cars.some(q=>q.k=='c'&&M.hypot(q.x-P.x,q.y-P.y)<450)?1:.25);toast('¡Robo de coche!','#ffcf33')}
 best.k='p';P.car=best;best.v*=.3}
function blocked(c){const fx=cos(c.a),fy=sin(c.a),lim=85+c.v*.25;
 const chk=(x,y,w)=>{const dx=x-c.x,dy=y-c.y,f=dx*fx+dy*fy;return f>0&&f<lim&&M.abs(-dx*fy+dy*fx)<w};
 for(const o of cars)if(o!==c&&chk(o.x,o.y,26))return 1;
 for(const p of peds)if(chk(p.x,p.y,18))return 1;
 return !P.car&&chk(P.x,P.y,18)}
function pick(c,ix,iy){const d=c.d,v=t=>t==0?ix<N-1:t==2?ix>0:t==1?iy<N-1:iy>0;
 let o=[d,(d+1)&3,(d+3)&3].filter(v);if(!o.length)o=[(d+2)&3];
 if(c.k=='c'&&stars>0){let best=o[0],bs=-9e9;for(const t of o){const s=cos(t*PI/2)*(P.x-c.x)+sin(t*PI/2)*(P.y-c.y);if(s>bs){bs=s;best=t}}return best}
 if(o.includes(d)&&rnd()<.55)return d;return o[rnd()*o.length|0]}
function carStep(c,dt){
 if(c.k=='p')return;
 if(c.hit>0)c.hit-=dt;
 if(c.k=='o'){c.v-=c.v*2*dt;if(M.abs(c.v)>1)move(c,dt);return}
 const cop=c.k=='c';let ts=c.ts,free=0;
 if(cop&&stars>0){const dx=P.x-c.x,dy=P.y-c.y,d=M.hypot(dx,dy);ts=300+stars*35;
  if(d<300&&c.hit<=0){free=1;ts=430;c.a+=cl(wrap(M.atan2(dy,dx)-c.a),-3.4*dt,3.4*dt);c.d=M.round(c.a/(PI/2))&3;c.li=-1}}
 if(!free){const d=c.d;c.a+=cl(wrap(d*PI/2-c.a),-4*dt,4*dt);
  if(d%2==0)c.y+=(cl(M.round((c.y-R/2)/B),0,N-1)*B+R/2+(d==0?22:-22)-c.y)*M.min(1,2.5*dt);
  else c.x+=(cl(M.round((c.x-R/2)/B),0,N-1)*B+R/2+(d==1?-22:22)-c.x)*M.min(1,2.5*dt);
  if(c.x%B<R&&c.y%B<R){const ix=c.x/B|0,iy=c.y/B|0,id=ix*64+iy,u=d%2==0?c.x%B:c.y%B;
   if(c.li!=id&&M.abs(u-R/2)<18){c.li=id;c.d=pick(c,ix,iy)}}else c.li=-1;
  let b=cop?0:blocked(c);if(b){c.bt+=dt;if(c.bt>3){b=0;if(c.bt>5)c.bt=0}}else c.bt=0;if(b)ts=0}
 c.v+=cl(ts-c.v,-520*dt,230*dt);move(c,dt);
 if(c.hp<40&&rnd()<.3)smoke(c.x,c.y,'#444',.9)}
function boom(c){cars.splice(cars.indexOf(c),1);expl(c.x,c.y);dec.push({x:c.x,y:c.y,k:'w',a:c.a});cam.sh=M.max(cam.sh,16);
 if(c===P.car){P.car=null;P.hp-=35;P.x=c.x;P.y=c.y}
 for(const q of cars){const d=M.hypot(q.x-c.x,q.y-c.y);if(d<120)q.hp-=50*(1-d/120)}
 for(let i=peds.length-1;i>=0;i--)if(M.hypot(peds[i].x-c.x,peds[i].y-c.y)<110)kill(i,0);
 if(!P.car){const d=M.hypot(P.x-c.x,P.y-c.y);if(d<120)P.hp-=45*(1-d/120)}}
function kill(i,by){const p=peds[i];peds.splice(i,1);dec.push({x:p.x,y:p.y,k:'b',r:5+rnd()*5});if(dec.length>140)dec.shift();for(let k=0;k<5;k++)smoke(p.x,p.y,'#a11',.5);if(by){crime(.55);money+=10+(rnd()*40|0)}}
/* ---------- partículas ---------- */
function smoke(x,y,c,l){if(par.length<450)par.push({x,y,vx:(rnd()-.5)*40,vy:(rnd()-.5)*40,r:3+rnd()*3,t:l,l,c,g:1})}
function spark(x,y){for(let i=0;i<5;i++)par.push({x,y,vx:(rnd()-.5)*320,vy:(rnd()-.5)*320,r:2,t:.25,l:.25,c:'#ffb347',g:0})}
function expl(x,y){const C=['#ffd25a','#ff8a2b','#ff4d1f'];for(let i=0;i<28;i++){const a=rnd()*7,s=40+rnd()*260,l=.4+rnd()*.5;par.push({x,y,vx:cos(a)*s,vy:sin(a)*s,r:5+rnd()*7,t:l,l,c:C[i%3],g:1})}for(let i=0;i<10;i++)smoke(x,y,'#2b2b2b',1.3)}
/* ---------- actualización ---------- */
function ringPt(vr,w){const a=rnd()*PI*2,r=vr+60+rnd()*w;return[P.x+cos(a)*r,P.y+sin(a)*r]}
function spawnCar(k,vr,w){const[x,y]=ringPt(vr,w);if(!(x>R&&y>R&&x<(N-1)*B+R/2&&y<(N-1)*B+R/2))return;
 const c=mk(0,0,0,k),d=k=='c'?(M.abs(P.x-x)>M.abs(P.y-y)?(P.x>x?0:2):(P.y>y?1:3)):(rnd()*4|0);
 lane(c,d,x,y);c.ts=150+rnd()*70;
 if(cars.some(q=>q!==c&&M.hypot(q.x-c.x,q.y-c.y)<60))cars.pop();else if(k=='c')c.v=250}
function spawnPed(vr,w){const[x,y]=ringPt(vr,w);if(hit(x,y,8))return;peds.push({x,y,a:rnd()*7,sp:40,t:1,col:`hsl(${rnd()*360|0} 55% 55%)`})}
function maintain(init){const vr=M.hypot(W,H)/2/cam.z+80,w=init?1400:450,sr=init?0:vr;
 cars=cars.filter(c=>{if(c===P.car||c.k=='p')return 1;const d=M.hypot(c.x-P.x,c.y-P.y);return d<vr+1200&&!(c.k=='c'&&stars==0&&d>vr+40)});
 peds=peds.filter(p=>M.hypot(p.x-P.x,p.y-P.y)<vr+700);
 let nt=0,nc=0;for(const c of cars){if(c.k=='t')nt++;if(c.k=='c')nc++}
 for(let i=0;i<(init?60:2);i++){if(nt<22){spawnCar('t',sr,w);nt++}if(peds.length<50)spawnPed(sr,w)}
 if(nc<(stars?M.min(8,stars+2):0))spawnCar('c',vr,300)}
function newMission(){let x,y,t=0;const pt=()=>[((rnd()*N)|0)*B+R/2,((rnd()*N)|0)*B+R/2];
 do{[x,y]=pt();t++}while(M.hypot(x-P.x,y-P.y)<900&&t<40);
 let bx,by;t=0;do{[bx,by]=pt();t++}while(M.hypot(bx-x,by-y)<1100&&t<40);
 ms={s:0,x,y,bx,by,t:0,r:M.round((M.hypot(bx-x,by-y)*.035+150)/10)*10}}
function upd(dt){
 gt+=dt;hour=(gt/10+8)%24;stars=M.floor(heat);
 mouse.wx=(mouse.x-W/2)/cam.z+cam.x;mouse.wy=(mouse.y-H/2)/cam.z+cam.y;
 if(P.car)driveP(dt);else foot(dt);
 if(pressE){pressE=0;toggleCar()}
 for(const c of cars)carStep(c,dt);
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y;
  if(M.abs(dx)>44||M.abs(dy)>44)continue;const d=M.hypot(dx,dy);
  if(d<42&&d>.01){const o=(42-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
   const rel=M.hypot(cos(a.a)*a.v-cos(b.a)*b.v,sin(a.a)*a.v-sin(b.a)*b.v);
   if(rel>130){a.hp-=(rel-100)*.05;b.hp-=(rel-100)*.05;spark((a.x+b.x)/2,(a.y+b.y)/2);if(a===P.car||b===P.car)cam.sh=M.max(cam.sh,8)}
   if(rel>60){a.v*=.7;b.v*=.7}}}
 for(const c of cars){if(M.abs(c.v)>100){
   for(let i=peds.length-1;i>=0;i--)if(M.hypot(peds[i].x-c.x,peds[i].y-c.y)<24)kill(i,c.k=='p');
   if(!P.car&&P.inv<=0&&c.k!='p'&&M.hypot(c.x-P.x,c.y-P.y)<24){P.hp-=M.abs(c.v)*.1;P.inv=.6}}}
 for(let i=cars.length-1;i>=0;i--)if(cars[i].hp<=0)boom(cars[i]);
 for(const p of peds){p.t-=dt;if(p.t<0){p.a+=(rnd()-.5)*2;p.t=1+rnd()*3;p.sp=rnd()<.2?0:35+rnd()*25}
  let sp=p.sp;for(const c of cars){const dx=p.x-c.x,dy=p.y-c.y;if(dx*dx+dy*dy<16900&&M.abs(c.v)>140){p.a=M.atan2(dy,dx);sp=130;break}}
  p.x+=cos(p.a)*sp*dt;p.y+=sin(p.a)*sp*dt;const h=hit(p.x,p.y,6);if(h){p.x+=h.nx*h.p;p.y+=h.ny*h.p;p.a+=PI/2+rnd()}}
 for(let i=bul.length-1;i>=0;i--){const b=bul[i];b.t-=dt;let dead=b.t<=0;
  for(let s=0;s<3&&!dead;s++){b.x+=b.vx*dt/3;b.y+=b.vy*dt/3;
   if(hit(b.x,b.y,1)){dead=1;spark(b.x,b.y);break}
   for(let j=peds.length-1;j>=0;j--)if(M.hypot(peds[j].x-b.x,peds[j].y-b.y)<9){kill(j,1);dead=1;break}
   if(dead)break;
   for(const c of cars)if(c!==P.car&&M.hypot(c.x-b.x,c.y-b.y)<22){c.hp-=c.k=='c'?18:30;spark(b.x,b.y);crime(c.k=='c'?.3:c.k=='t'?.15:0);if(c.hp<=0&&c.k!='o')crime(1.2);dead=1;break}}
  if(dead)bul.splice(i,1)}
 for(const p of par){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.t-=dt}par=par.filter(p=>p.t>0);
 let near=0,close=0;for(const c of cars)if(c.k=='c'){const d=M.hypot(c.x-P.x,c.y-P.y);if(d<380)near=1;if(d<46)close=1}
 if(stars>0&&close&&(!P.car||M.abs(P.car.v)<40))busted+=dt;else busted=M.max(0,busted-dt);
 if(!near)heat=M.max(0,heat-.04*dt);
 if(busted>1.8)respawn('ARRESTADO','#6aa8ff',M.round(money*.25)+50);

 maintain(0);
